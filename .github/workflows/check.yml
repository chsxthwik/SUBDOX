name: check

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntax
        run: |
          python -m py_compile scan.py scripts/perms.py
          bash -n scripts/enum.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -v
